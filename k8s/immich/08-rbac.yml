---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich
  namespace: immich
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: immich
  namespace: immich
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: immich
  namespace: immich
subjects:
  - kind: ServiceAccount
    name: immich
    namespace: immich
roleRef:
  kind: Role
  name: immich
  apiGroup: rbac.authorization.k8s.io