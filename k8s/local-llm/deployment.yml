---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-deployment
  namespace: llm
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      terminationGracePeriodSeconds: 120
      nodeSelector:
        nvidia.com/gpu.present: "true"
        # kubernetes.io/hostname: k3s-gpu-worker
      containers:
      - name: ollama
        image: ollama/ollama:0.20.5
        ports:
        - containerPort: 11434
          name: ollama-port
        resources:
          requests:
            nvidia.com/gpu: 1
            cpu: "2"
            memory: "24Gi"
          limits:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "30Gi"
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/tags
            port: 11434
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 6

      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-pvc


---
